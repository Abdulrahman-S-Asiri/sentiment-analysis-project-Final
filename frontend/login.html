<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sentiment Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 200px);
      padding: var(--spacing-xl) 0;
    }
    
    .auth-card {
      width: 100%;
      max-width: 450px;
      animation: fadeIn 0.6s ease-out;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }
    
    .auth-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--spacing-md);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
    }
    
    .auth-footer {
      text-align: center;
      margin-top: var(--spacing-md);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }
    
    .auth-footer a {
      color: var(--primary-light);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition-normal);
    }
    
    .auth-footer a:hover {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="container">
      <a href="/home" class="logo">
        <i class="fas fa-brain"></i> Sentiment Analyzer
      </a>
      <nav class="nav-bar">
        <a href="/home"><i class="fas fa-home"></i> Home</a>
        <a href="/register"><i class="fas fa-user-plus"></i> Register</a>
        <a href="/about"><i class="fas fa-info-circle"></i> About</a>
        <a href="/analyze" class="hidden"><i class="fas fa-magic"></i> Analyze</a>
        <a href="/history-page" class="hidden"><i class="fas fa-history"></i> History</a>
        <a href="/login" onclick="localStorage.clear()" class="hidden"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
  </header>

  <main class="auth-container">
    <div class="card auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fas fa-sign-in-alt"></i>
        </div>
        <h2 class="card-title">Welcome Back!</h2>
        <p class="card-subtitle">Login to access your dashboard and start analyzing sentiments</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="Enter your email"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Password
          </label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>
      
      <p class="auth-footer">
        Don't have an account? <a href="/register">Sign up here</a>
      </p>
    </div>
  </main>

  <footer class="main-footer">
    <div class="container">
      <p>© 2025 Sentiment Analyzer. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("token");
      const analyze = document.querySelector('a[href="/analyze"]');
      const history = document.querySelector('a[href="/history-page"]');
      const logout = document.querySelector('a[href="/login"]');

      if (token) {
        window.location.href = "/analyze";
        return;
      }

      if (analyze) analyze.classList.add("hidden");
      if (history) history.classList.add("hidden");
      if (logout) logout.classList.add("hidden");
    });
  </script>

  <script>
    window.addEventListener("load", () => {
      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submitBtn = loginForm.querySelector("button[type='submit']");

      if (localStorage.getItem("token")) {
        window.location.href = "/analyze";
        return;
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          alert("⚠️ Please fill in both fields.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (response.ok) {
            localStorage.setItem("token", data.access_token);
            submitBtn.innerHTML = '<i class="fas fa-check"></i> Success! Redirecting...';
            setTimeout(() => {
              window.location.href = "/analyze";
            }, 500);
          } else {
            alert(`❌ ${data.detail || "Login failed."}`);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
          }
        } catch (error) {
          console.error("🚨 Error during login:", error);
          alert("🚨 Network error. Try again later.");
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }
      });
    });
  </script>
</body>
</html>
